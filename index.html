<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Conecta Idoso — Tecnologia, direitos e acolhimento para idosos e suas famílias.">
  <meta name="theme-color" content="#2E8B57">
  <title>Conecta Idoso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/contrast.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="alto-contraste">

  <nav>
    <div class="nav-inner">
      <button type="button" class="logo" id="logo-btn" aria-label="Ir para o início">
        <div class="logo-icon" aria-hidden="true">🤝</div>
        <div>
          <div class="logo-text">Conecta Idoso</div>
          <div class="logo-slogan">Tecnologia, direitos e acolhimento</div>
        </div>
      </button>

      <div class="nav-acoes">
        <label class="toggle-contraste" title="Ativar ou desativar o modo de alto contraste">
          <svg class="icone-contraste" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M12 3a9 9 0 0 1 0 18V3z" fill="currentColor"/>
          </svg>
          <span class="toggle-contraste-texto">Alto contraste</span>
          <input type="checkbox" id="toggle-contraste" checked aria-label="Alto contraste">
          <span class="toggle-switch" aria-hidden="true"></span>
        </label>

        <ul class="nav-links">
          <li><a href="#home" data-nav="home">Início</a></li>
          <li><a href="#direitos" data-nav="direitos">Meus Direitos</a></li>
          <li><a href="#digital" data-nav="digital">Inclusão Digital</a></li>
          <li><a href="#assistiva" data-nav="assistiva">Tecnologia Assistiva</a></li>
          <li><a href="#servicos" data-nav="servicos">Serviços</a></li>
          <li><a href="#ajuda" data-nav="ajuda">Preciso de Ajuda</a></li>
          <li><a href="#emergencia" data-nav="emergencia" class="btn-emergencia-nav">🚨 Emergência</a></li>
        </ul>

        <button type="button" class="btn-emergencia-mobile" id="btn-emergencia-mobile" aria-label="Emergência">
          🚨 <span class="btn-emerg-label">Emergência</span>
        </button>

        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-drawer">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>

  <div class="nav-drawer" id="nav-drawer" aria-hidden="true">
    <ul class="nav-links">
      <li><a href="#home" data-nav="home">Início</a></li>
      <li><a href="#direitos" data-nav="direitos">Meus Direitos</a></li>
      <li><a href="#digital" data-nav="digital">Inclusão Digital</a></li>
      <li><a href="#assistiva" data-nav="assistiva">Tecnologia Assistiva</a></li>
      <li><a href="#servicos" data-nav="servicos">Serviços</a></li>
      <li><a href="#ajuda" data-nav="ajuda">Preciso de Ajuda</a></li>
      <li><a href="#emergencia" data-nav="emergencia" class="btn-emergencia-nav">🚨 Emergência</a></li>
    </ul>
    <div class="nav-drawer-footer">
      <label class="toggle-contraste toggle-contraste--drawer" title="Ativar ou desativar o modo de alto contraste">
        <svg class="icone-contraste" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3a9 9 0 0 1 0 18V3z" fill="currentColor"/>
        </svg>
        <span class="toggle-contraste-texto">Alto contraste</span>
        <input type="checkbox" id="toggle-contraste-drawer" aria-label="Alto contraste">
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
    </div>
  </div>

  <main id="main-content">
    <div class="page-loading">Carregando...</div>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
